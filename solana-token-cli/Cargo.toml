[package]
name = "solana-token-cli"
version = "0.1.0"
edition = "2021"

[dependencies]
solana-sdk = "1.17"
solana-client = "1.17"
solana-program = "1.17"
spl-token = "4.0"
spl-associated-token-account = "2.0"
clap = { version = "4.4", features = ["derive"] }
anyhow = "1.0"
thiserror = "1.0"
tokio = { version = "1.0", features = ["full"] }
colored = "2.0"
indicatif = "0.17"
console = "0.15"
dotenv = "0.15"
shellexpand = "3.1"
bs58 = "0.5"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"